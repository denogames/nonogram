name: ci

# Runs only for code already on master (or a manual run by a maintainer). There is no
# pull_request trigger: this repository is public and the job holds a credential for the
# private studio-core-sdk, so untrusted pull-request code must never run with it.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # STUDIO_CORE_SDK_READ_TOKEN: read-only access to denogames/studio-core-sdk contents and
      # nothing else. It is visible to this step only, through git's environment config, and
      # is never written to disk or printed (GitHub also masks it).
      - name: Resolve dependencies
        env:
          SDK_READ_TOKEN: ${{ secrets.STUDIO_CORE_SDK_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          if [ -z "$SDK_READ_TOKEN" ]; then
            echo "::error::Secret STUDIO_CORE_SDK_READ_TOKEN is not set (read-only access to denogames/studio-core-sdk)."
            exit 1
          fi
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="url.https://x-access-token:${SDK_READ_TOKEN}@github.com/denogames/studio-core-sdk.insteadOf" \
          GIT_CONFIG_VALUE_0="https://github.com/denogames/studio-core-sdk" \
            flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
